services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wpnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  backup_restore:
    build:
      context: .
      dockerfile: Dockerfile.restore
    environment:
      LOAD_BACKUP: ${LOAD_BACKUP:-false}
      DB_NAME: ${DB_NAME:-wordpress}
      DB_USER: ${DB_USER:-wordpress}
      DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
    networks:
      - wpnet

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH: testuser:testpassword123
      MP_MAX_MESSAGES: 500
    command:
      - "--smtp-auth-allow-insecure"
    networks:
      - wpnet
    restart: unless-stopped

  fix_urls:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
      backup_restore:
        condition: service_completed_successfully
    environment:
      OLD_URL: ${OLD_URL:-}
      NEW_URL: ${NEW_URL:-}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      LOAD_BACKUP: ${LOAD_BACKUP:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_MEMORY_LIMIT', '512M' );
    volumes:
      - wp_data:/var/www/html
      - ./scripts/fix-urls.sh:/fix-urls.sh:ro
    networks:
      - wpnet
    entrypoint:
      - /bin/sh
      - /fix-urls.sh

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backup_restore:
        condition: service_completed_successfully
      fix_urls:
        condition: service_completed_successfully
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_MEMORY_LIMIT', '512M' );
    volumes:
      - wp_data:/var/www/html
    ports:
      - "80:80"
    networks:
      - wpnet

volumes:
  db_data:
  wp_data:

networks:
  wpnet:
    driver: bridge
